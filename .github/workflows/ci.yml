on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: npm install --min-release-age=7 -g @devcontainers/cli@0.87.0
      - run: devcontainer up
      - run: devcontainer exec bun run lint
      - run: devcontainer exec bun run test
      - run: devcontainer exec bun run build
